name: Preparar corpus y evaluación
on: workflow_dispatch
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m scripts.preparar_todo
      - run: python -m scripts.empaquetar
      - uses: actions/upload-artifact@v4
        with:
          name: fiqa-entrega
          path: |
            dist/
            data/fuentes.json
